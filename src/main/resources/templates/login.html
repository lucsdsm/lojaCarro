<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LojaCarro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .card {
            width: min(400px, calc(100% - 32px));
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
        }

        h1 {
            margin: 0 0 8px;
            color: #0f172a;
        }

        p {
            color: #475569;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: 600;
            color: #1e293b;
        }

        input {
            width: 100%;
            margin-top: 6px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            cursor: pointer;
            border: 0;
            border-radius: 8px;
            color: #ffffff;
            background: #2563eb;
            font-size: 16px;
            font-weight: 700;
        }

        .erro {
            padding: 10px;
            border-radius: 8px;
            color: #991b1b;
            background: #fee2e2;
        }

        .sucesso {
            padding: 10px;
            border-radius: 8px;
            color: #166534;
            background: #dcfce7;
        }
    </style>
</head>
<body>
<main class="card">
    <h1>LojaCarro</h1>
    <p>Entre com sua conta para acessar o sistema.</p>

    <div class="erro" th:if="${param.error}">
        E-mail ou senha inválidos.
    </div>

    <div class="sucesso" th:if="${param.logout}">
        Logout realizado com sucesso.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="username">E-mail</label>
        <input
                id="username"
                name="username"
                type="email"
                autocomplete="email"
                required
        >

        <label for="password">Senha</label>
        <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
        >

        <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}"
        >

        <button type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
