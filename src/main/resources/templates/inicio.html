<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | LojaCarro</title>
    <link rel="stylesheet" th:href="@{/css/sistema.css}">
</head>
<body>
<header class="header">
    <div class="container header-content">
        <a class="brand" th:href="@{/}">LojaCarro</a>

        <div class="header-actions">
            <span class="account" th:text="${email}">
                usuario@exemplo.com
            </span>

            <form th:action="@{/logout}" method="post">
                <button class="button button-secondary" type="submit">
                    Sair
                </button>
            </form>
        </div>
    </div>
</header>

<main class="container">
    <section class="page-heading">
        <div>
            <h1>Modelos disponíveis</h1>
            <p class="subtitle">Conheça os carros cadastrados na loja.</p>
        </div>

        <nav class="actions" aria-label="Gestão do sistema">
            <a
                    class="button"
                    th:if="${podeGerenciarCarros}"
                    th:href="@{/gestao/carros}"
            >
                Gerenciar carros
            </a>

            <a
                    class="button button-secondary"
                    th:if="${administrador}"
                    th:href="@{/admin/usuarios}"
            >
                Gerenciar usuários
            </a>
        </nav>
    </section>

    <section class="card empty-state" th:if="${#lists.isEmpty(carros)}">
        <h2>Nenhum carro disponível</h2>
        <p>Os modelos cadastrados aparecerão aqui.</p>
    </section>

    <section
            class="grid"
            th:unless="${#lists.isEmpty(carros)}"
            aria-label="Catálogo de carros"
    >
        <article class="card" th:each="carro : ${carros}">
            <h2 class="vehicle-title" th:text="${carro.modelo}">Modelo</h2>

            <p class="vehicle-meta">
                Ano:
                <span th:text="${carro.ano}">2026</span>
            </p>

            <p class="price">
                R$
                <span
                        th:text="${#numbers.formatDecimal(
                        carro.preco, 1, 'POINT', 2, 'COMMA'
                    )}"
                >
                    0,00
                </span>
            </p>
        </article>
    </section>
</main>
</body>
</html>
